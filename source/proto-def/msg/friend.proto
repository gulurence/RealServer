// =============================================================================
// friend.proto — 好友模块协议 (一级 Actor 类型 = AT_FRIEND = 102)
//
// 结构规范: 消息ID枚举 => 子数据定义 => 协议定义
// 协议定义每条消息前两个字段为 uint32 BigType / uint32 SmallType (消息路由):
//   BigType   = 一级 actor 类型 (固定 102 = AT_FRIEND)
//   SmallType = 本模块内消息 ID (FriendMsgId 枚举)
// 后续接消息数据。
// =============================================================================
syntax = "proto3";

package PbFriend;

import "msg/msg_id.proto";

// ---------------------------------------------------------------------------
// 消息 ID 枚举 (SmallType 路由字段取值)
// ---------------------------------------------------------------------------
enum FriendMsgId {
  FRIEND_MSG_NONE         = 0;
  FRIEND_ADD_REQ          = 1;   // 客户端 -> Friend: 加好友申请
  FRIEND_ADD_RSP          = 2;   // Friend -> 客户端: 申请结果
  FRIEND_ADD_APPLY_NTF    = 3;   // Friend -> 被申请人: 收到好友申请
  FRIEND_ADD_ACCEPT_REQ   = 4;   // 客户端 -> Friend: 同意/拒绝申请
  FRIEND_ADD_ACCEPT_RSP   = 5;   // Friend -> 客户端: 处理结果
  FRIEND_LIST_REQ         = 6;   // 客户端 -> Friend: 拉好友列表
  FRIEND_LIST_RSP         = 7;   // Friend -> 客户端: 好友列表
  FRIEND_DEL_REQ          = 8;   // 客户端 -> Friend: 删除好友
  FRIEND_DEL_RSP          = 9;   // Friend -> 客户端: 删除结果
  FRIEND_ONLINE_NTF       = 10;  // Friend -> 好友: 好友上下线通知
  FRIEND_INVITE_REQ       = 11;  // 客户端 -> Friend: 邀请好友组队
  FRIEND_INVITE_NTF       = 12;  // Friend -> 被邀请人: 组队邀请
}

// ---------------------------------------------------------------------------
// 子数据定义
// ---------------------------------------------------------------------------

// 好友条目摘要
message PBFriendInfo {
  int64  player_id = 1;   // 好友玩家 ID
  string name      = 2;   // 好友昵称
  int32  level     = 3;   // 好友等级
  bool   online    = 4;   // 是否在线
}

// ---------------------------------------------------------------------------
// 协议定义
// ---------------------------------------------------------------------------

// 加好友申请 (客户端 -> Friend)
message PBFriendAddReq {
  uint32 big_type         = 1;   // = AT_FRIEND (102)
  uint32 small_type       = 2;   // = FRIEND_ADD_REQ (1)
  int64  target_player_id = 3;   // 目标玩家 ID
}

// 加好友申请结果 (Friend -> 客户端)
message PBFriendAddRsp {
  uint32 big_type         = 1;
  uint32 small_type       = 2;   // = FRIEND_ADD_RSP (2)
  PbID.ErrorCode error_code = 3;
  int64  target_player_id = 4;
}

// 收到好友申请 (Friend -> 被申请人)
message PBFriendApplyNtf {
  uint32 big_type         = 1;
  uint32 small_type       = 2;   // = FRIEND_ADD_APPLY_NTF (3)
  int64  applicant_id     = 3;   // 申请人玩家 ID
  string applicant_name   = 4;   // 申请人昵称
}

// 同意/拒绝申请 (客户端 -> Friend)
message PBFriendAcceptReq {
  uint32 big_type         = 1;
  uint32 small_type       = 2;   // = FRIEND_ADD_ACCEPT_REQ (4)
  int64  friend_id        = 3;   // 申请人玩家 ID
  bool   accept           = 4;   // true=同意 false=拒绝
}

// 处理结果 (Friend -> 客户端)
message PBFriendAcceptRsp {
  uint32 big_type         = 1;
  uint32 small_type       = 2;   // = FRIEND_ADD_ACCEPT_RSP (5)
  PbID.ErrorCode error_code = 3;
  int64  friend_id        = 4;
}

// 拉好友列表 (客户端 -> Friend)
message PBFriendListReq {
  uint32 big_type         = 1;
  uint32 small_type       = 2;   // = FRIEND_LIST_REQ (6)
}

// 好友列表 (Friend -> 客户端)
message PBFriendListRsp {
  uint32 big_type         = 1;
  uint32 small_type       = 2;   // = FRIEND_LIST_RSP (7)
  PbID.ErrorCode error_code = 3;
  repeated PBFriendInfo friends = 4;
}

// 删除好友 (客户端 -> Friend)
message PBFriendDelReq {
  uint32 big_type         = 1;
  uint32 small_type       = 2;   // = FRIEND_DEL_REQ (8)
  int64  friend_id        = 3;
}

// 删除结果 (Friend -> 客户端)
message PBFriendDelRsp {
  uint32 big_type         = 1;
  uint32 small_type       = 2;   // = FRIEND_DEL_RSP (9)
  PbID.ErrorCode error_code = 3;
  int64  friend_id        = 4;
}

// 好友上下线通知 (Friend -> 好友)
message PBFriendOnlineNtf {
  uint32 big_type         = 1;
  uint32 small_type       = 2;   // = FRIEND_ONLINE_NTF (10)
  int64  friend_id        = 3;
  bool   online           = 4;
}

// 邀请好友组队 (客户端 -> Friend)
message PBFriendInviteReq {
  uint32 big_type         = 1;
  uint32 small_type       = 2;   // = FRIEND_INVITE_REQ (11)
  int64  friend_id        = 3;
}

// 组队邀请 (Friend -> 被邀请人)
message PBFriendInviteNtf {
  uint32 big_type         = 1;
  uint32 small_type       = 2;   // = FRIEND_INVITE_NTF (12)
  int64  inviter_id       = 3;   // 邀请人玩家 ID
  int64  room_id          = 4;   // 邀请人所在房间 (无房间则为 0)
}
