      定义 LoginMsgId 枚举与 PBMsgLoginReq/Rsp、PBMsgSelectRoleReq/Rsp、PBMsgCreateRoleReq/Rsp、PBMsgLogoutReq/Rsp
      包名 PbLogin，含登录排队字段与断线重连 battle 信息，一级 Actor 类型 AT_LOGIN=101
  *****************************************************************/

// =============================================================================
// login.proto — 登录模块协议 (一级 Actor 类型 = AT_LOGIN = 101)
//
// 结构规范: 消息ID枚举 => 子数据定义 => 协议定义
// 协议定义每条消息前两个字段为 uint32 BigType / uint32 SmallType (消息路由):
//   BigType   = 一级 actor 类型 (固定 101 = AT_LOGIN)
//   SmallType = 本模块内消息 ID (LoginMsgId 枚举)
// 后续接消息数据。
// =============================================================================
syntax = "proto3";

package PbLogin;

import "msg/msg_id.proto";
import "msg/account.proto";

// ---------------------------------------------------------------------------
// 消息 ID 枚举 (SmallType 路由字段取值)
// ---------------------------------------------------------------------------
enum LoginMsgId {
  LOGIN_MSG_NONE             = 0;
  LOGIN_MSG_LOGIN_REQ        = 1;   // 客户端 -> Gate: 携带 Session 登录
  LOGIN_MSG_LOGIN_RSP        = 2;   // Gate -> 客户端: 账号信息 + 角色列表
  LOGIN_MSG_SELECT_ROLE_REQ  = 3;   // 客户端 -> Gate: 选角
  LOGIN_MSG_SELECT_ROLE_RSP  = 4;   // Gate -> 客户端: 选角结果 + Player 信息
  LOGIN_MSG_CREATE_ROLE_REQ  = 5;   // 客户端 -> Gate: 创角
  LOGIN_MSG_CREATE_ROLE_RSP  = 6;   // Gate -> 客户端: 创角结果 + RoleInfo
  LOGIN_MSG_LOGOUT_REQ       = 7;   // 客户端 -> Gate: 主动登出 (下线列表 + 房间/战斗收尾)
  LOGIN_MSG_LOGOUT_RSP       = 8;   // Gate -> 客户端: 登出确认
}

// ---------------------------------------------------------------------------
// 协议定义
// ---------------------------------------------------------------------------

// 登录请求 (客户端 -> Gate)
message PBMsgLoginReq {
  uint32 big_type   = 1;   // = AT_LOGIN (101)
  uint32 small_type = 2;   // = LOGIN_MSG_LOGIN_REQ (1)
  string token      = 3;   // WebPlatform 签发的 Session token
  int64  account_id = 4;   // 可选: 若已知 account_id 可直接带上
}

// 登录响应 (Gate -> 客户端)
message PBMsgLoginRsp {
  uint32 big_type   = 1;   // = AT_LOGIN (101)
  uint32 small_type = 2;   // = LOGIN_MSG_LOGIN_RSP (2)
  PbID.ErrorCode error_code = 3;
  PbAccount.AccountInfo        account = 4;   // 账号信息
  repeated PbAccount.RoleInfo  roles   = 5;   // 角色列表
  int64  queue_position = 6;   // 排队位置 (>0 表示排队中, error_code=ERR_QUEUED)
  int32  queue_est_wait = 7;   // 预计等待秒数 (平均等待时间动态计算)
}

// 选角请求 (客户端 -> Gate)
message PBMsgSelectRoleReq {
  uint32 big_type   = 1;   // = AT_LOGIN (101)
  uint32 small_type = 2;   // = LOGIN_MSG_SELECT_ROLE_REQ (3)
  int64  account_id = 3;
  int64  role_id    = 4;
}

// 选角响应 (Gate -> 客户端)
message PBMsgSelectRoleRsp {
  uint32 big_type   = 1;   // = AT_LOGIN (101)
  uint32 small_type = 2;   // = LOGIN_MSG_SELECT_ROLE_RSP (4)
  PbID.ErrorCode error_code = 3;
  PbAccount.PlayerInfo player = 4;   // Player actor 创建完成后的玩家信息
  int64  battle_id   = 5;   // 断线重连: >0 = 玩家当前战斗房 id (可直连重连)
  string battle_host = 6;   // 战斗进程直连地址 "ip:port" (battle:host:{battleId})
  string battle_auth = 7;   // 战斗重连 auth_key (battle:auth:{battleId})
}

// 创角请求 (客户端 -> Gate)
message PBMsgCreateRoleReq {
  uint32 big_type   = 1;   // = AT_LOGIN (101)
  uint32 small_type = 2;   // = LOGIN_MSG_CREATE_ROLE_REQ (5)
  int64  account_id = 3;
  string role_name  = 4;   // 角色名
  int32  job        = 5;   // 职业
}

// 创角响应 (Gate -> 客户端)
message PBMsgCreateRoleRsp {
  uint32 big_type   = 1;   // = AT_LOGIN (101)
  uint32 small_type = 2;   // = LOGIN_MSG_CREATE_ROLE_RSP (6)
  PbID.ErrorCode error_code = 3;
  PbAccount.RoleInfo role = 4;   // 创建成功的角色摘要
}

// 登出请求 (客户端 -> Gate) — 无业务字段, 发送方身份由连接映射 (connPlayer[cid]) 决定。
message PBMsgLogoutReq {
  uint32 big_type   = 1;   // = AT_LOGIN (101)
  uint32 small_type = 2;   // = LOGIN_MSG_LOGOUT_REQ (7)
}

// 登出响应 (Gate -> 客户端)
message PBMsgLogoutRsp {
  uint32 big_type   = 1;   // = AT_LOGIN (101)
  uint32 small_type = 2;   // = LOGIN_MSG_LOGOUT_RSP (8)
  PbID.ErrorCode error_code = 3;
}
