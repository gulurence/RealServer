// actor_mgr.proto — Cross-process actor management RPC message schema
//
// Enables ActorMgr to create, find, and uninstall actors on remote processes.
// 仅保留 PBRPC* 消息结构; 传输走 asio-TCP (engine/xRpc/CRpcTcpClient), 无 gRPC service。

syntax = "proto3";

package actormgr;

// ---------------------------------------------------------------------------
// CreateActor — request a remote process to create an actor instance
// ---------------------------------------------------------------------------
message PBRPCCreateActorRequest {
    int32 actor_type = 1;   // ActorType enum value
    int64 actor_id   = 2;   // Unique actor instance ID
}

message PBRPCCreateActorReply {
    bool  success     = 1;
    int32 error_code  = 2;  // 0 = ok, nonzero = xErrorCode
}

// ---------------------------------------------------------------------------
// FindActor — query whether a remote process has an actor instance
// ---------------------------------------------------------------------------
message PBRPCFindActorRequest {
    int32 actor_type = 1;
    int64 actor_id   = 2;
}

message PBRPCFindActorReply {
    bool  found       = 1;
    int32 remote_type = 2;  // The type of the remote process hosting it (if found)
}

// ---------------------------------------------------------------------------
// UninstallActor — request a remote process to uninstall an actor
// ---------------------------------------------------------------------------
message PBRPCUninstallActorRequest {
    int32 actor_type = 1;
    int64 actor_id   = 2;
}

message PBRPCUninstallActorReply {
    bool  success    = 1;
    int32 error_code = 2;
}

// (service 定义已退役 — RPC 传输走 asio-TCP, 见 engine/xRpc/CRpcTcpClient)
